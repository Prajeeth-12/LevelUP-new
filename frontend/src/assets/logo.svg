<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" fill="none">
  <style>
    .level-text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 52px; letter-spacing: -1px; }
    .up-text { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 52px; fill: #f97316; letter-spacing: -1px; }
    @media (prefers-color-scheme: dark) {
      .level-text { fill: #ffffff; }
    }
    @media (prefers-color-scheme: light) {
      .level-text { fill: #09090b; }
    }
  </style>
  <text x="10" y="70" class="level-text">LEVEL</text>
  <!-- Geometric UP arrow indicator -->
  <polygon points="195,22 235,22 235,42 215,42" fill="#f97316" />
  <text x="215" y="70" class="up-text">UP</text>
</svg>